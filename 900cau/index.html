<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>900 Mẫu Câu Giao Tiếp Cùng Bé - VandonStay</title>
  <script src="https://cdn.tailwindcss.com/"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .ipa-text { color: #059669; }
    .vn-text { color: #475569; }
    .active-sentence { border-color: #10b981 !important; background-color: #ecfdf5 !important; }
    .char-animation { animation: float 3s ease-in-out infinite; }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    [data-netlify-deploy-id], 
    iframe[src*="netlify"], 
    div[class*="netlify"], 
    #netlify-drawer, 
    .netlify-badge, 
    [class*="NetlifyBadge"], 
    [id*="netlify"], 
    div[style*="z-index: 2147483647"] {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
      opacity: 0 !important;
      height: 0 !important;
      width: 0 !important;
    }
  </style>
</head>
<body class="flex justify-center text-slate-800 select-none">
  <div class="w-full max-w-md bg-white flex flex-col h-full shadow-2xl relative p-1.5 justify-between border-x border-slate-200">
    
    <!-- 1. THANH ĐIỀU HƯỚNG NHANH -->
    <div class="flex items-center justify-between gap-1.5 pb-1.5 shrink-0 border-b border-slate-100">
      <a href="../index.html" class="flex-1 py-1 px-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-[10px] font-bold shadow-sm transition flex items-center justify-center gap-1">
        <i class="fa-solid fa-graduation-cap text-[11px]"></i> <span>Trang chủ</span>
      </a>
      <a href="https://vandonstay.pages.dev" class="flex-1 py-1 px-1.5 bg-teal-600 hover:bg-teal-700 text-white rounded-lg text-[10px] font-bold shadow-sm transition flex items-center justify-center gap-1">
        <i class="fa-solid fa-hotel text-[11px]"></i> <span>Villa Sonasea</span>
      </a>
      <a href="https://s.shopee.vn/3qNFfgl0qh" target="_blank" rel="noopener noreferrer" class="flex-1 py-1 px-1.5 bg-amber-500 hover:bg-amber-600 text-white rounded-lg text-[10px] font-bold shadow-sm transition flex items-center justify-center gap-1">
        <i class="fa-solid fa-cart-shopping text-[11px]"></i> <span>Ủng hộ Shopee</span>
      </a>
    </div>

    <!-- 2. THANH RUY-BĂNG DÒNG CHỮ CHẠY -->
    <section class="relative bg-emerald-50/50 border border-emerald-200 rounded shadow-sm shrink-0 z-30 overflow-hidden mt-1 py-0.5 px-1.5">
      <div class="max-w-7xl mx-auto flex items-center">
        <i class="fa-solid fa-gift text-amber-500 text-[10px] mr-1.5"></i>
        <a href="https://s.shopee.vn/3qNFfgl0qh" target="_blank" rel="noopener noreferrer" class="block group cursor-pointer flex-1 overflow-hidden" title="Bấm để ghé thăm Shopee QN">
          <marquee behavior="scroll" direction="left" scrollamount="4" class="text-[10px] text-emerald-800 font-semibold group-hover:text-emerald-600 transition pt-0.5">
            Để duy trì học liệu hoàn toàn miễn phí, rất mong quý khách mỗi khi mua sắm trên Shopee hãy ghé qua gian hàng liên kết của chúng tôi! Trân trọng cảm ơn.
          </marquee>
        </a>
      </div>
    </section>

    <!-- Header Bài Học: Chọn Nghe -->
    <header class="bg-emerald-50/80 border border-emerald-200 rounded-lg px-2 py-1 flex items-center justify-between shadow-sm shrink-0 gap-1 mt-1">
      <div class="flex items-center gap-1 font-bold text-emerald-900 text-[11px]">
        <span>Từ:</span>
        <select id="startLessonSelect" class="bg-white font-bold py-0.5 px-1 rounded border border-emerald-300 focus:outline-none text-[11px] shadow-sm cursor-pointer"></select>
        <span class="ml-1">Đến:</span>
        <select id="endLessonSelect" class="bg-white font-bold py-0.5 px-1 rounded border border-emerald-300 focus:outline-none text-[11px] shadow-sm cursor-pointer"></select>
      </div>

      <button id="toggleTransBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white border border-emerald-500 px-2 py-1 rounded font-bold flex items-center gap-1 shadow-sm transition text-[10px]">
        <i class="fa-solid fa-language text-[11px]"></i> <span>Dịch & IPA</span>
      </button>
    </header>

    <!-- Khung Nội Dung Bài Học -->
    <main class="flex-1 flex flex-col justify-between py-1 overflow-hidden" id="mainContent">
      <div id="currentCardContainer" class="h-full flex flex-col justify-between"></div>
    </main>

    <!-- Thanh Điều Khiển Cố Định Dưới Cùng (TỐI ƯU CÒN 1 HÀNG) -->
    <footer class="bg-white border-t border-slate-200 rounded-t-xl p-1.5 shrink-0 relative shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] mt-0.5">
      
      <!-- Popup Lặp Lại -->
      <div id="repeatMenu" class="hidden absolute bottom-[50px] left-1/2 -translate-x-1/2 w-28 bg-white border border-slate-200 rounded-xl p-1 shadow-xl z-50">
        <button data-repeat="1" class="repeat-opt w-full text-left px-3 py-1.5 rounded hover:bg-emerald-50 text-slate-700 text-xs font-bold transition mb-0.5">1 lần</button>
        <button data-repeat="2" class="repeat-opt w-full text-left px-3 py-1.5 rounded hover:bg-emerald-50 text-slate-700 text-xs font-bold transition mb-0.5">2 lần</button>
        <button data-repeat="3" class="repeat-opt w-full text-left px-3 py-1.5 rounded hover:bg-emerald-50 text-slate-700 text-xs font-bold transition mb-0.5">3 lần</button>
        <button data-repeat="5" class="repeat-opt w-full text-left px-3 py-1.5 rounded hover:bg-emerald-50 text-slate-700 text-xs font-bold transition mb-0.5">5 lần</button>
        <button data-repeat="999" class="repeat-opt w-full text-left px-3 py-1.5 rounded hover:bg-emerald-50 text-emerald-600 text-xs font-black transition">Vô tận (∞)</button>
      </div>

      <!-- Popup Tốc Độ -->
      <div id="speedMenu" class="hidden absolute bottom-[50px] right-2 w-24 bg-white border border-slate-200 rounded-xl p-1 shadow-xl z-50">
        <button data-speed="0.5" class="speed-opt w-full text-left px-3 py-1.5 rounded hover:bg-cyan-50 text-slate-700 text-xs font-bold transition mb-0.5">0.5x</button>
        <button data-speed="0.75" class="speed-opt w-full text-left px-3 py-1.5 rounded hover:bg-cyan-50 text-slate-700 text-xs font-bold transition mb-0.5">0.75x</button>
        <button data-speed="1.0" class="speed-opt w-full text-left px-3 py-1.5 rounded hover:bg-cyan-50 text-slate-700 text-xs font-bold transition mb-0.5">1.0x (Chuẩn)</button>
        <button data-speed="1.25" class="speed-opt w-full text-left px-3 py-1.5 rounded hover:bg-cyan-50 text-slate-700 text-xs font-bold transition mb-0.5">1.25x</button>
        <button data-speed="1.5" class="speed-opt w-full text-left px-3 py-1.5 rounded hover:bg-cyan-50 text-slate-700 text-xs font-bold transition mb-0.5">1.5x</button>
        <button data-speed="2.0" class="speed-opt w-full text-left px-3 py-1.5 rounded hover:bg-cyan-50 text-slate-700 text-xs font-bold transition">2.0x</button>
      </div>

      <!-- 1 HÀNG DUY NHẤT BAO GỒM TẤT CẢ CÁC NÚT -->
      <div class="flex items-center justify-between gap-1">
        
        <!-- Nút Gốc (MP3) -->
        <button id="voiceToggleBtn" class="flex-1 h-9 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-[10.5px] flex items-center justify-center gap-1 border border-emerald-500 transition shadow-sm whitespace-nowrap px-1">
          <i class="fa-solid fa-file-audio text-[11px]" id="voiceIcon"></i>
          <span id="voiceText">Gốc (MP3)</span>
        </button>

        <!-- Nút Bài Trước -->
        <button id="prevBtn" class="w-10 h-9 shrink-0 bg-slate-50 hover:bg-slate-100 active:scale-95 text-slate-600 rounded-lg border border-slate-200 flex items-center justify-center transition shadow-sm">
          <i class="fa-solid fa-backward-step text-[13px]"></i>
        </button>

        <!-- Nút PLAY Lớn Ở Giữa -->
        <button id="playBtn" class="flex-none w-14 h-9 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white rounded-lg border border-emerald-500 flex items-center justify-center shadow transition mx-0.5">
          <i class="fa-solid fa-play text-sm" id="playIcon"></i>
        </button>

        <!-- Nút Bài Sau -->
        <button id="nextBtn" class="w-10 h-9 shrink-0 bg-slate-50 hover:bg-slate-100 active:scale-95 text-slate-600 rounded-lg border border-slate-200 flex items-center justify-center transition shadow-sm">
          <i class="fa-solid fa-forward-step text-[13px]"></i>
        </button>

        <!-- Nút Lặp -->
        <button id="repeatToggleBtn" class="w-11 h-9 shrink-0 rounded-lg bg-slate-50 hover:bg-slate-100 text-slate-700 font-bold text-[10.5px] border border-slate-200 flex items-center justify-center gap-1 transition shadow-sm">
          <i class="fa-solid fa-rotate text-[9px] text-emerald-600"></i>
          <span id="repeatText">1</span>
        </button>

        <!-- Nút Tốc Độ -->
        <button id="speedToggleBtn" class="w-12 h-9 shrink-0 rounded-lg bg-slate-50 hover:bg-slate-100 text-slate-700 font-bold text-[10.5px] border border-slate-200 flex items-center justify-center gap-1 transition shadow-sm">
          <i class="fa-solid fa-gauge-high text-[9px] text-cyan-600"></i>
          <span id="speedText">1.0x</span>
        </button>
        
      </div>

    </footer>

  </div>

  <script src="./js/data.js"></script>
  <script>
    let synth = window.speechSynthesis;
    let currentUtterance = null;
    let isSpeechUnlocked = false;

    function unlockAudioEngine() {
      if (!isSpeechUnlocked && synth) {
        try {
          const u = new SpeechSynthesisUtterance('');
          u.volume = 0;
          synth.speak(u);
          isSpeechUnlocked = true;
        } catch (e) {}
      }
    }
    document.body.addEventListener('touchstart', unlockAudioEngine, { once: true });
    document.body.addEventListener('click', unlockAudioEngine, { once: true });

    function getEnVoice() {
      if (!synth) return null;
      const voices = synth.getVoices() || [];
      return voices.find(v => v.lang === 'en-US' || v.lang === 'en_US') ||
             voices.find(v => v.lang.startsWith('en')) || null;
    }
    if (synth && synth.onvoiceschanged !== undefined) {
      synth.onvoiceschanged = () => { synth.getVoices(); };
    }

    let currentLessonIdx = 0;
    let startIdx = 0;
    let endIdx = 0;

    let currentMode = 'mp3';
    let currentSpeed = 1.0;
    let currentRepeatLimit = 1;
    let currentRepeat = 0;

    let isPlaying = false;
    let showDetails = true;
    let audioPlayer = new Audio();

    const startSelect = document.getElementById('startLessonSelect');
    const endSelect = document.getElementById('endLessonSelect');
    const currentCardContainer = document.getElementById('currentCardContainer');

    const repeatMenu = document.getElementById('repeatMenu');
    const speedMenu = document.getElementById('speedMenu');

    function initLessonSelectors() {
      startSelect.innerHTML = '';
      endSelect.innerHTML = '';
      if (typeof LESSONS_DATA === 'undefined') return;

      LESSONS_DATA.forEach((item, idx) => {
        const opt1 = document.createElement('option');
        opt1.value = idx;
        opt1.innerText = `${item.id}`;
        startSelect.appendChild(opt1);

        const opt2 = document.createElement('option');
        opt2.value = idx;
        opt2.innerText = `${item.id}`;
        endSelect.appendChild(opt2);
      });

      startIdx = 0;
      endIdx = 0; 
      startSelect.value = startIdx;
      endSelect.value = endIdx;
      currentLessonIdx = startIdx;
    }
    
    function syncDropdownsToCurrent(idx) {
        startSelect.value = idx;
        endSelect.value = idx;
        startIdx = idx;
        endIdx = idx;
    }
    
    window.handleImageFallback = function(imgElement, baseId) {
        let attempt = parseInt(imgElement.getAttribute('data-attempt') || '0');
        imgElement.onerror = null;

        if (attempt === 0) {
            imgElement.setAttribute('data-attempt', '1');
            imgElement.src = `./animated_webp/card_${baseId}.webp`; 
        } else if (attempt === 1) {
            imgElement.setAttribute('data-attempt', '2');
            imgElement.src = `./image/${baseId}.jpeg`; 
        } else if (attempt === 2) {
            imgElement.setAttribute('data-attempt', '3');
            imgElement.src = `./image/${baseId}`; 
        } else if (attempt === 3) {
            imgElement.setAttribute('data-attempt', '4');
            imgElement.src = `./image/${baseId}.png`; 
        } else {
            imgElement.style.display = 'none';
        }
    };

    function renderLesson(idx) {
      if (typeof LESSONS_DATA === 'undefined' || !LESSONS_DATA[idx]) {
          currentCardContainer.innerHTML = '<div class="text-center p-4 text-rose-500 font-bold">Lỗi: Không tải được dữ liệu bài học.</div>';
          return;
      }
      
      const item = LESSONS_DATA[idx];
      let sentencesHtml = '';
      
      const displaySentences = item.sentences ? item.sentences.slice(0, 3) : [];
      
      if (displaySentences.length) {
        sentencesHtml = displaySentences.map((s, sIdx) => {
          const viTrans = s.vi || '';
          const ipaText = s.ipa || '';

          return `
            <div id="sent-${sIdx}" class="sentence-row px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 cursor-pointer transition flex items-start justify-between shadow-sm" onclick="playSingleSentence('${s.en.replace(/'/g, "\'")}', ${sIdx})">
              
              <div class="text-[12px] leading-[1.3] flex-1">
                <span class="font-bold text-slate-900">• ${s.en}</span>
                <span class="trans-box ${showDetails ? 'inline' : 'hidden'}">
                  ${ipaText ? `<span class="ipa-text font-mono font-semibold ml-1">/${ipaText}/</span>` : ''}
                  ${viTrans ? `<span class="vn-text font-medium ml-1">(${viTrans})</span>` : ''}
                </span>
              </div>
              
              <div class="pt-[3px] shrink-0 ml-2">
                  <i class="fa-solid fa-volume-high text-[11px] text-emerald-500 opacity-80"></i>
              </div>
              
            </div>
          `;
        }).join('');
      }

      currentCardContainer.innerHTML = `
        <div class="border border-emerald-200 bg-emerald-50/40 rounded-xl p-2 shadow-sm flex flex-col h-full">
          
          <div class="flex items-center justify-between pb-1 border-b border-emerald-200/60 shrink-0 mb-1">
            <span class="text-[10.5px] font-black uppercase text-emerald-700 tracking-wider">Tình huống thực tế</span>
            <span class="px-2 py-0.5 rounded-full bg-emerald-600 text-white flex items-center justify-center text-[10px] font-bold shadow-sm">Bài ${item.id}</span>
          </div>

          <div class="w-full bg-white rounded-lg p-1 border border-slate-200 flex items-center justify-center overflow-hidden flex-1 shadow-inner min-h-0 relative">
            <img src="./image/${item.id}.jpg?v=5" alt="Minh họa bài ${item.id}" 
                 class="max-w-full max-h-full object-contain scale-[1.02] char-animation drop-shadow-sm absolute inset-0 m-auto" 
                 data-attempt="0"
                 onerror="handleImageFallback(this, '${item.id}')">
          </div>

          <div class="shrink-0 flex flex-col mt-1.5 gap-1">
            ${sentencesHtml}
          </div>
        </div>
      `;
    }

    const toggleTransBtn = document.getElementById('toggleTransBtn');

    toggleTransBtn.addEventListener('click', () => {
      showDetails = !showDetails;
      if (showDetails) {
        toggleTransBtn.className = "bg-emerald-600 hover:bg-emerald-700 text-white border border-emerald-500 px-2 py-1 rounded font-bold flex items-center gap-1 shadow-sm transition text-[10px]";
      } else {
        toggleTransBtn.className = "bg-slate-100 hover:bg-slate-200 text-slate-600 border border-slate-300 px-2 py-1 rounded font-bold flex items-center gap-1 shadow-sm transition text-[10px]";
      }

      document.querySelectorAll('.trans-box').forEach(el => {
        if (showDetails) {
            el.classList.remove('hidden');
            el.classList.add('inline');
        } else {
            el.classList.add('hidden');
            el.classList.remove('inline');
        }
      });
    });

    document.getElementById('repeatToggleBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      speedMenu.classList.add('hidden');
      repeatMenu.classList.toggle('hidden');
    });

    document.getElementById('speedToggleBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      repeatMenu.classList.add('hidden');
      speedMenu.classList.toggle('hidden');
    });

    document.addEventListener('click', () => {
      repeatMenu.classList.add('hidden');
      speedMenu.classList.add('hidden');
    });

    document.querySelectorAll('.repeat-opt').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        currentRepeatLimit = parseInt(e.target.getAttribute('data-repeat'));
        currentRepeat = 0;
        updateRepeatDisplay();
        repeatMenu.classList.add('hidden');
      });
    });

    function updateRepeatDisplay() {
      const limitStr = currentRepeatLimit === 999 ? '∞' : `${currentRepeatLimit}`;
      document.getElementById('repeatText').innerText = `${limitStr}`;
    }

    document.querySelectorAll('.speed-opt').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        currentSpeed = parseFloat(e.target.getAttribute('data-speed'));
        document.getElementById('speedText').innerText = `${currentSpeed}x`;
        if (audioPlayer) audioPlayer.playbackRate = currentSpeed;
        speedMenu.classList.add('hidden');
      });
    });

    startSelect.addEventListener('change', (e) => {
      stopPlayback();
      startIdx = parseInt(e.target.value);
      if (endIdx < startIdx) {
        endIdx = startIdx;
        endSelect.value = endIdx;
      }
      currentLessonIdx = startIdx;
      renderLesson(currentLessonIdx);
      currentRepeat = 0;
    });

    endSelect.addEventListener('change', (e) => {
      stopPlayback();
      endIdx = parseInt(e.target.value);
      if (endIdx < startIdx) {
        startIdx = endIdx;
        startSelect.value = startIdx;
      }
      currentLessonIdx = startIdx;
      renderLesson(currentLessonIdx);
      currentRepeat = 0;
    });

    const voiceBtn = document.getElementById('voiceToggleBtn');
    voiceBtn.addEventListener('click', () => {
      stopPlayback();
      if (currentMode === 'mp3') {
        currentMode = 'ai';
        voiceBtn.className = "flex-1 h-9 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-bold text-[10.5px] flex items-center justify-center gap-1 border border-blue-500 transition shadow-sm whitespace-nowrap px-1";
        document.getElementById('voiceIcon').className = "fa-solid fa-robot text-[11px]";
        document.getElementById('voiceText').innerText = "AI Speech";
      } else {
        currentMode = 'mp3';
        voiceBtn.className = "flex-1 h-9 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-[10.5px] flex items-center justify-center gap-1 border border-emerald-500 transition shadow-sm whitespace-nowrap px-1";
        document.getElementById('voiceIcon').className = "fa-solid fa-file-audio text-[11px]";
        document.getElementById('voiceText').innerText = "Gốc (MP3)";
      }
    });

    document.getElementById('playBtn').addEventListener('click', () => {
      if (isPlaying) {
        stopPlayback();
      } else {
        isPlaying = true;
        document.getElementById('playIcon').className = "fa-solid fa-pause text-sm";

        if (currentLessonIdx < startIdx || currentLessonIdx > endIdx) {
          currentLessonIdx = startIdx;
          renderLesson(currentLessonIdx);
        }
        currentRepeat = 0;
        playCurrentLesson();
      }
    });

    function stopPlayback() {
      isPlaying = false;
      if (audioPlayer) { audioPlayer.pause(); audioPlayer.currentTime = 0; }
      if (synth) synth.cancel();
      currentUtterance = null;
      document.getElementById('playIcon').className = "fa-solid fa-play text-sm";
      document.querySelectorAll('.sentence-row').forEach(el => el.classList.remove('active-sentence'));
    }

    function handleLessonFinished() {
      if (!isPlaying) return;

      currentRepeat++;

      if (currentRepeat < currentRepeatLimit) {
        setTimeout(() => { if (isPlaying) playCurrentLesson(); }, 400);
      } else {
        currentRepeat = 0;

        if (currentLessonIdx < endIdx) {
          currentLessonIdx++;
          syncDropdownsToCurrent(currentLessonIdx);
          renderLesson(currentLessonIdx);
          setTimeout(() => { if (isPlaying) playCurrentLesson(); }, 600);
        } else {
          if (currentRepeatLimit === 999) {
            currentLessonIdx = startIdx;
            syncDropdownsToCurrent(currentLessonIdx);
            renderLesson(currentLessonIdx);
            setTimeout(() => { if (isPlaying) playCurrentLesson(); }, 800);
          } else {
            stopPlayback();
          }
        }
      }
    }

    function playCurrentLesson() {
      if (!isPlaying) return;
      if (currentMode === 'mp3') {
        playMp3();
      } else {
        playAi(0);
      }
    }

    function playMp3() {
      let mp3Src = `./mp3/lesson_${LESSONS_DATA[currentLessonIdx].id}.mp3`;
      if (audioPlayer.src && audioPlayer.src.includes('audio')) {
          mp3Src = `./audio/lesson_${LESSONS_DATA[currentLessonIdx].id}.mp3`;
      }
      
      audioPlayer.src = mp3Src;
      audioPlayer.playbackRate = currentSpeed;
      
      audioPlayer.play().catch(() => {
        if (mp3Src.includes('/mp3/')) {
             audioPlayer.src = `./audio/lesson_${LESSONS_DATA[currentLessonIdx].id}.mp3`;
             audioPlayer.play().catch(() => {
                 voiceBtn.click(); 
                 playCurrentLesson();
             });
        } else {
            voiceBtn.click();
            playCurrentLesson();
        }
      });

      audioPlayer.onended = () => {
        handleLessonFinished();
      };
    }

    function playAi(sIdx) {
      if (!synth || !isPlaying) return;
      const item = LESSONS_DATA[currentLessonIdx];

      if (!item.sentences || sIdx >= item.sentences.length || sIdx >= 3) {
        handleLessonFinished();
        return;
      }

      document.querySelectorAll('.sentence-row').forEach(el => el.classList.remove('active-sentence'));
      const row = document.getElementById(`sent-${sIdx}`);
      if (row) row.classList.add('active-sentence');

      synth.cancel();
      if (synth.paused) synth.resume();

      currentUtterance = new SpeechSynthesisUtterance(item.sentences[sIdx].en);
      currentUtterance.lang = 'en-US';
      currentUtterance.rate = currentSpeed;
      
      const v = getEnVoice();
      if (v) currentUtterance.voice = v;

      currentUtterance.onend = () => {
        if (isPlaying) setTimeout(() => playAi(sIdx + 1), 350);
      };
      currentUtterance.onerror = () => {
        if (isPlaying) setTimeout(() => playAi(sIdx + 1), 350);
      };

      synth.speak(currentUtterance);
    }

    window.playSingleSentence = function(text, sIdx) {
      stopPlayback();
      if (!synth) return;
      document.querySelectorAll('.sentence-row').forEach(el => el.classList.remove('active-sentence'));
      const row = document.getElementById(`sent-${sIdx}`);
      if (row) row.classList.add('active-sentence');
      
      synth.cancel();
      if (synth.paused) synth.resume();

      currentUtterance = new SpeechSynthesisUtterance(text);
      currentUtterance.lang = 'en-US';
      currentUtterance.rate = currentSpeed;
      
      const v = getEnVoice();
      if (v) currentUtterance.voice = v;

      currentUtterance.onend = () => row.classList.remove('active-sentence');
      currentUtterance.onerror = () => row.classList.remove('active-sentence');

      synth.speak(currentUtterance);
    };

    document.getElementById('prevBtn').addEventListener('click', () => {
      if (currentLessonIdx > 0) {
        stopPlayback();
        currentLessonIdx--;
        syncDropdownsToCurrent(currentLessonIdx);
        renderLesson(currentLessonIdx);
        currentRepeat = 0;
        
        isPlaying = true;
        document.getElementById('playIcon').className = "fa-solid fa-pause text-sm";
        playCurrentLesson();
      }
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (currentLessonIdx < LESSONS_DATA.length - 1) {
        stopPlayback();
        currentLessonIdx++;
        syncDropdownsToCurrent(currentLessonIdx);
        renderLesson(currentLessonIdx);
        currentRepeat = 0;
        
        isPlaying = true;
        document.getElementById('playIcon').className = "fa-solid fa-pause text-sm";
        playCurrentLesson();
      }
    });

    setTimeout(() => {
        initLessonSelectors();
        renderLesson(startIdx);
        updateRepeatDisplay();
    }, 100);

  </script>
</body>
</html>
