<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>900 Mẫu Câu Giao Tiếp Cùng Bé - VandonStay</title>
  <script src="https://cdn.tailwindcss.com/"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0b1324;
    }
    .ipa-text { color: #10b981; font-style: italic; }
    .vn-text { color: #94a3b8; }
    .active-sentence { border-color: #10b981 !important; background-color: rgba(16, 185, 129, 0.18) !important; }
    .char-animation { animation: float 3s ease-in-out infinite; }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    /* Ẩn các class tự sinh của Cloudflare/Netlify */
    [data-netlify-deploy-id], 
    iframe[src*="netlify"], 
    div[class*="netlify"], 
    #netlify-drawer, 
    .netlify-badge, 
    [class*="NetlifyBadge"], 
    [id*="netlify"], 
    div[style*="z-index: 2147483647"] {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
      opacity: 0 !important;
      height: 0 !important;
      width: 0 !important;
    }
  </style>
</head>
<body class="flex justify-center text-slate-100 select-none">
  <div class="w-full max-w-md bg-slate-900 flex flex-col h-full shadow-2xl relative p-2 justify-between border-x border-slate-800">
    
    <!-- 1. THANH ĐIỀU HƯỚNG NHANH HỆ SINH THÁI -->
    <div class="flex items-center justify-between gap-1.5 pb-1 shrink-0 border-b border-slate-800">
      <a href="../index.html" class="flex-1 py-1.5 px-2 bg-slate-800/90 hover:bg-slate-700 text-emerald-400 rounded-lg text-[10.5px] font-bold border border-slate-700 flex items-center justify-center gap-1.5 transition shadow-sm">
        <i class="fa-solid fa-graduation-cap text-xs"></i> <span>Trang chủ</span>
      </a>
      <a href="https://vandonstay.pages.dev" class="flex-1 py-1.5 px-2 bg-slate-800/90 hover:bg-slate-700 text-teal-300 rounded-lg text-[10.5px] font-bold border border-slate-700 flex items-center justify-center gap-1.5 transition shadow-sm">
        <i class="fa-solid fa-hotel text-xs"></i> <span>Villa Sonasea</span>
      </a>
      <a href="https://s.shopee.vn/3qNFfgl0qh" target="_blank" rel="noopener noreferrer" class="flex-1 py-1.5 px-2 bg-slate-800/90 hover:bg-slate-700 text-amber-400 rounded-lg text-[10.5px] font-bold border border-slate-700 flex items-center justify-center gap-1.5 transition shadow-sm">
        <i class="fa-solid fa-cart-shopping text-xs"></i> <span>Ủng hộ Shopee</span>
      </a>
    </div>

    <!-- 2. THANH RUY-BĂNG DÒNG CHỮ CHẠY -->
    <section class="relative bg-gradient-to-r from-emerald-800 via-teal-800 to-emerald-900 text-white py-1 px-2 border border-emerald-600/50 rounded-lg shadow shrink-0 z-30 overflow-hidden mt-1.5">
      <div class="max-w-7xl mx-auto flex items-center">
        <i class="fa-solid fa-gift text-amber-300 text-[10px] mr-2"></i>
        <a href="https://s.shopee.vn/3qNFfgl0qh" target="_blank" rel="noopener noreferrer" class="block group cursor-pointer flex-1 overflow-hidden" title="Bấm để ghé thăm Shopee QN">
          <marquee behavior="scroll" direction="left" scrollamount="4" class="text-[10.5px] text-emerald-100 font-medium group-hover:text-amber-200 transition">
            Để duy trì học liệu hoàn toàn miễn phí, rất mong quý khách mỗi khi mua sắm trên Shopee hãy ghé qua gian hàng liên kết của chúng tôi! Trân trọng cảm ơn.
          </marquee>
        </a>
      </div>
    </section>

    <!-- Header Bài Học: Chọn Nghe -->
    <header class="bg-slate-800/80 border border-slate-700 rounded-xl px-2.5 py-1.5 flex items-center justify-between shadow-sm shrink-0 gap-1 text-[11px] mt-1.5">
      <div class="flex items-center gap-1.5 font-semibold text-emerald-400">
        <span>Từ:</span>
        <select id="startLessonSelect" class="bg-slate-900 text-white font-bold py-0.5 px-1.5 rounded border border-slate-600 focus:outline-none text-[11px]">
        </select>
        <span class="ml-1">Đến:</span>
        <select id="endLessonSelect" class="bg-slate-900 text-white font-bold py-0.5 px-1.5 rounded border border-slate-600 focus:outline-none text-[11px]">
        </select>
      </div>

      <button id="toggleTransBtn" class="bg-emerald-700 hover:bg-emerald-600 border border-emerald-600 px-2 py-1 rounded font-bold flex items-center gap-1 shadow transition text-[10.5px]">
        <i class="fa-solid fa-language text-[11px]"></i> <span>Dịch & IPA</span>
      </button>
    </header>

    <!-- Khung Nội Dung Bài Học -->
    <main class="flex-1 flex flex-col justify-between py-1.5 overflow-hidden" id="mainContent">
      <div id="currentCardContainer" class="h-full flex flex-col justify-between"></div>
    </main>

    <!-- Thanh Điều Khiển Cố Định Dưới Cùng -->
    <footer class="bg-slate-950 border border-slate-800 rounded-xl p-2 shrink-0 space-y-1.5 relative shadow-lg mt-0.5">
      
      <!-- Popup Lặp Lại -->
      <div id="repeatMenu" class="hidden absolute bottom-[88px] left-1/2 -translate-x-1/2 w-32 bg-slate-900 border border-emerald-600/60 rounded-xl p-1 shadow-2xl z-50">
        <button data-repeat="1" class="repeat-opt w-full text-left px-3 py-1.5 rounded bg-slate-800 hover:bg-emerald-700 text-xs font-bold text-white transition mb-0.5">1 lần</button>
        <button data-repeat="2" class="repeat-opt w-full text-left px-3 py-1.5 rounded bg-slate-800 hover:bg-emerald-700 text-xs font-bold text-white transition mb-0.5">2 lần</button>
        <button data-repeat="3" class="repeat-opt w-full text-left px-3 py-1.5 rounded bg-slate-800 hover:bg-emerald-700 text-xs font-bold text-white transition mb-0.5">3 lần</button>
        <button data-repeat="5" class="repeat-opt w-full text-left px-3 py-1.5 rounded bg-slate-800 hover:bg-emerald-700 text-xs font-bold text-white transition mb-0.5">5 lần</button>
        <button data-repeat="999" class="repeat-opt w-full text-left px-3 py-1.5 rounded bg-slate-800 hover:bg-emerald-700 text-xs font-bold text-amber-400 transition">Vô tận (∞)</button>
      </div>

      <!-- Popup Tốc Độ -->
      <div id="speedMenu" class="hidden absolute bottom-[88px] right-2 w-28 bg-slate-900 border border-cyan-600/60 rounded-xl p-1 shadow-2xl z-50">
        <button data-speed="0.5" class="speed-opt w-full text-left px-3 py-1.5 rounded bg-slate-800 hover:bg-cyan-700 text-xs font-bold text-white transition mb-0.5">0.5x</button>
        <button data-speed="0.75" class="speed-opt w-full text-left px-3 py-1.5 rounded bg-slate-800 hover:bg-cyan-700 text-xs font-bold text-white transition mb-0.5">0.75x</button>
        <button data-speed="1.0" class="speed-opt w-full text-left px-3 py-1.5 rounded bg-slate-800 hover:bg-cyan-700 text-xs font-bold text-white transition mb-0.5">1.0x (Chuẩn)</button>
        <button data-speed="1.25" class="speed-opt w-full text-left px-3 py-1.5 rounded bg-slate-800 hover:bg-cyan-700 text-xs font-bold text-white transition mb-0.5">1.25x</button>
        <button data-speed="1.5" class="speed-opt w-full text-left px-3 py-1.5 rounded bg-slate-800 hover:bg-cyan-700 text-xs font-bold text-white transition mb-0.5">1.5x</button>
        <button data-speed="2.0" class="speed-opt w-full text-left px-3 py-1.5 rounded bg-slate-800 hover:bg-cyan-700 text-xs font-bold text-white transition">2.0x</button>
      </div>

      <!-- HÀNG 1: Tùy chỉnh (Cân đối lại trên Dark Mode) -->
      <div class="grid grid-cols-12 gap-1.5">
        <button id="voiceToggleBtn" class="col-span-6 h-7 rounded-lg bg-emerald-700 hover:bg-emerald-600 text-white font-bold text-[11px] flex items-center justify-center gap-1 border border-emerald-500 transition shadow">
          <i class="fa-solid fa-file-audio text-[12px]" id="voiceIcon"></i>
          <span id="voiceText">Gốc (MP3)</span>
        </button>

        <button id="repeatToggleBtn" class="col-span-3 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-emerald-400 font-bold text-[11px] border border-slate-600 flex items-center justify-center gap-1 transition shadow">
          <i class="fa-solid fa-rotate text-[10px]"></i>
          <span id="repeatText">Lặp: 1</span>
        </button>

        <button id="speedToggleBtn" class="col-span-3 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold text-[11px] border border-slate-600 flex items-center justify-center gap-1 transition shadow">
          <i class="fa-solid fa-gauge-high text-[10px]"></i>
          <span id="speedText">1.0x</span>
        </button>
      </div>

      <!-- HÀNG 2: Điều hướng -->
      <div class="grid grid-cols-12 gap-1.5">
        <button id="prevBtn" class="col-span-2 h-9 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 rounded-lg border border-slate-600 flex items-center justify-center transition shadow">
          <i class="fa-solid fa-backward-step text-sm"></i>
        </button>

        <button id="playBtn" class="col-span-8 h-9 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold text-[13px] rounded-lg border border-emerald-500 flex items-center justify-center gap-2 shadow-lg transition">
          <i class="fa-solid fa-play" id="playIcon"></i>
          <span id="playText">Phát Audio</span>
        </button>

        <button id="nextBtn" class="col-span-2 h-9 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 rounded-lg border border-slate-600 flex items-center justify-center transition shadow">
          <i class="fa-solid fa-forward-step text-sm"></i>
        </button>
      </div>

    </footer>

  </div>

  <script src="./js/data.js"></script>
  <script>
    let synth = window.speechSynthesis;
    let currentUtterance = null;
    let isSpeechUnlocked = false;

    function unlockAudioEngine() {
      if (!isSpeechUnlocked && synth) {
        try {
          const u = new SpeechSynthesisUtterance('');
          u.volume = 0;
          synth.speak(u);
          isSpeechUnlocked = true;
        } catch (e) {}
      }
    }
    document.body.addEventListener('touchstart', unlockAudioEngine, { once: true });
    document.body.addEventListener('click', unlockAudioEngine, { once: true });

    function getEnVoice() {
      if (!synth) return null;
      const voices = synth.getVoices() || [];
      return voices.find(v => v.lang === 'en-US' || v.lang === 'en_US') ||
             voices.find(v => v.lang.startsWith('en')) || null;
    }
    if (synth && synth.onvoiceschanged !== undefined) {
      synth.onvoiceschanged = () => { synth.getVoices(); };
    }

    let currentLessonIdx = 0;
    let startIdx = 0;
    let endIdx = 0;

    let currentMode = 'mp3';
    let currentSpeed = 1.0;
    let currentRepeatLimit = 1;
    let currentRepeat = 0;

    let isPlaying = false;
    let showDetails = true;
    let audioPlayer = new Audio();

    const startSelect = document.getElementById('startLessonSelect');
    const endSelect = document.getElementById('endLessonSelect');
    const currentCardContainer = document.getElementById('currentCardContainer');

    const repeatMenu = document.getElementById('repeatMenu');
    const speedMenu = document.getElementById('speedMenu');

    function initLessonSelectors() {
      startSelect.innerHTML = '';
      endSelect.innerHTML = '';
      if (typeof LESSONS_DATA === 'undefined') return;

      LESSONS_DATA.forEach((item, idx) => {
        const opt1 = document.createElement('option');
        opt1.value = idx;
        opt1.innerText = `${item.id}`;
        startSelect.appendChild(opt1);

        const opt2 = document.createElement('option');
        opt2.value = idx;
        opt2.innerText = `${item.id}`;
        endSelect.appendChild(opt2);
      });

      startIdx = 0;
      endIdx = 0; // Mặc định Bài 1 -> Bài 1
      startSelect.value = startIdx;
      endSelect.value = endIdx;
      currentLessonIdx = startIdx;
    }
    
    function syncDropdownsToCurrent(idx) {
        startSelect.value = idx;
        endSelect.value = idx;
        startIdx = idx;
        endIdx = idx;
    }
    
    // CƠ CHẾ FETCH ẢNH ĐỘNG THÔNG MINH CHO CLOUDFLARE PAGES (Vượt qua lỗi cache 404)
    window.handleImageFallback = function(imgElement, baseId) {
        let attempt = parseInt(imgElement.getAttribute('data-attempt') || '0');
        imgElement.onerror = null; // Khóa vòng lặp

        if (attempt === 0) {
            imgElement.setAttribute('data-attempt', '1');
            imgElement.src = `./animated_webp/card_${baseId}.webp`; // Ưu tiên WebP hoạt hình
        } else if (attempt === 1) {
            imgElement.setAttribute('data-attempt', '2');
            imgElement.src = `./image/${baseId}.jpeg`; // Thử JPEG
        } else if (attempt === 2) {
            imgElement.setAttribute('data-attempt', '3');
            imgElement.src = `./image/${baseId}`; // Thử không đuôi
        } else if (attempt === 3) {
            imgElement.setAttribute('data-attempt', '4');
            imgElement.src = `./image/${baseId}.png`; // Thử PNG
        } else {
            // Ảnh lỗi vĩnh viễn
            imgElement.style.display = 'none';
        }
    };

    function renderLesson(idx) {
      if (typeof LESSONS_DATA === 'undefined' || !LESSONS_DATA[idx]) {
          currentCardContainer.innerHTML = '<div class="text-center p-4 text-rose-500 font-bold">Lỗi: Không tải được dữ liệu bài học.</div>';
          return;
      }
      
      const item = LESSONS_DATA[idx];
      let sentencesHtml = '';
      
      // BẮT BUỘC RENDER TỐI ĐA 3 CÂU
      const displaySentences = item.sentences ? item.sentences.slice(0, 3) : [];
      
      if (displaySentences.length) {
        sentencesHtml = displaySentences.map((s, sIdx) => {
          const viTrans = s.vi || '';
          const ipaText = s.ipa || '';

          return `
            <div id="sent-${sIdx}" class="sentence-row px-2.5 py-1.5 rounded-xl border border-slate-700/80 bg-slate-800/60 hover:bg-slate-700 cursor-pointer transition flex flex-col justify-center shadow-sm" onclick="playSingleSentence('${s.en.replace(/'/g, "\'")}', ${sIdx})">
              <div class="flex items-center justify-between">
                <span class="font-bold text-slate-100 text-[13px] leading-tight">• ${s.en}</span>
                <i class="fa-solid fa-volume-high text-[11px] text-emerald-400 opacity-60 ml-1.5"></i>
              </div>
              <div class="trans-box ${showDetails ? '' : 'hidden'} mt-1 space-y-0.5 text-[10.5px]">
                ${ipaText ? `<p class="ipa-text font-mono leading-tight text-emerald-400/90">${ipaText}</p>` : ''}
                ${viTrans ? `<p class="vn-text font-medium leading-tight text-slate-300"><span class="bg-slate-700 text-slate-400 px-1 rounded text-[9px] mr-1 font-bold">VN</span>${viTrans}</p>` : ''}
              </div>
            </div>
          `;
        }).join('');
      }

      // XỬ LÝ KHUNG ẢNH (DARK MODE):
      currentCardContainer.innerHTML = `
        <div class="border border-emerald-900 bg-slate-950 rounded-2xl p-2 shadow flex flex-col justify-between h-full">
          
          <div class="flex items-center justify-between pb-1.5 border-b border-slate-800 shrink-0">
            <span class="text-[10px] font-black uppercase text-emerald-500 tracking-wider">Tình huống thực tế</span>
            <span class="px-2 py-0.5 rounded-full bg-emerald-600 text-white flex items-center justify-center text-[10px] font-bold shadow-sm">Bài ${item.id}</span>
          </div>

          <div class="w-full bg-slate-900 rounded-xl p-1 border border-slate-800 flex items-center justify-center overflow-hidden my-1.5 flex-1 min-h-[140px]">
            <img src="./image/${item.id}.jpg?v=2" alt="Minh họa bài ${item.id}" 
                 class="max-w-full max-h-full object-contain scale-[1.02] char-animation drop-shadow-md" 
                 data-attempt="0"
                 onerror="handleImageFallback(this, '${item.id}')">
          </div>

          <div class="space-y-1.5 shrink-0">
            ${sentencesHtml}
          </div>
        </div>
      `;
    }

    const toggleTransBtn = document.getElementById('toggleTransBtn');

    toggleTransBtn.addEventListener('click', () => {
      showDetails = !showDetails;
      if (showDetails) {
        toggleTransBtn.className = "bg-emerald-700 hover:bg-emerald-600 border border-emerald-600 px-2 py-1 rounded font-bold flex items-center gap-1 shadow transition text-[10.5px] text-white";
      } else {
        toggleTransBtn.className = "bg-slate-700 hover:bg-slate-600 border border-slate-600 px-2 py-1 rounded font-bold flex items-center gap-1 shadow transition text-[10.5px] text-slate-300";
      }

      document.querySelectorAll('.trans-box').forEach(el => {
        el.classList.toggle('hidden', !showDetails);
      });
    });

    document.getElementById('repeatToggleBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      speedMenu.classList.add('hidden');
      repeatMenu.classList.toggle('hidden');
    });

    document.getElementById('speedToggleBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      repeatMenu.classList.add('hidden');
      speedMenu.classList.toggle('hidden');
    });

    document.addEventListener('click', () => {
      repeatMenu.classList.add('hidden');
      speedMenu.classList.add('hidden');
    });

    document.querySelectorAll('.repeat-opt').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        currentRepeatLimit = parseInt(e.target.getAttribute('data-repeat'));
        currentRepeat = 0;
        updateRepeatDisplay();
        repeatMenu.classList.add('hidden');
      });
    });

    function updateRepeatDisplay() {
      const limitStr = currentRepeatLimit === 999 ? '∞' : `${currentRepeatLimit}`;
      document.getElementById('repeatText').innerText = `Lặp: ${limitStr}`;
    }

    document.querySelectorAll('.speed-opt').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        currentSpeed = parseFloat(e.target.getAttribute('data-speed'));
        document.getElementById('speedText').innerText = `${currentSpeed}x`;
        if (audioPlayer) audioPlayer.playbackRate = currentSpeed;
        speedMenu.classList.add('hidden');
      });
    });

    startSelect.addEventListener('change', (e) => {
      stopPlayback();
      startIdx = parseInt(e.target.value);
      if (endIdx < startIdx) {
        endIdx = startIdx;
        endSelect.value = endIdx;
      }
      currentLessonIdx = startIdx;
      renderLesson(currentLessonIdx);
      currentRepeat = 0;
    });

    endSelect.addEventListener('change', (e) => {
      stopPlayback();
      endIdx = parseInt(e.target.value);
      if (endIdx < startIdx) {
        startIdx = endIdx;
        startSelect.value = startIdx;
      }
      currentLessonIdx = startIdx;
      renderLesson(currentLessonIdx);
      currentRepeat = 0;
    });

    const voiceBtn = document.getElementById('voiceToggleBtn');
    voiceBtn.addEventListener('click', () => {
      stopPlayback();
      if (currentMode === 'mp3') {
        currentMode = 'ai';
        voiceBtn.className = "col-span-6 h-7 rounded-lg bg-blue-700 hover:bg-blue-600 text-white font-bold text-[11px] flex items-center justify-center gap-1 border border-blue-500 transition shadow";
        document.getElementById('voiceIcon').className = "fa-solid fa-robot text-[12px]";
        document.getElementById('voiceText').innerText = "AI Speech";
      } else {
        currentMode = 'mp3';
        voiceBtn.className = "col-span-6 h-7 rounded-lg bg-emerald-700 hover:bg-emerald-600 text-white font-bold text-[11px] flex items-center justify-center gap-1 border border-emerald-500 transition shadow";
        document.getElementById('voiceIcon').className = "fa-solid fa-file-audio text-[12px]";
        document.getElementById('voiceText').innerText = "Gốc (MP3)";
      }
    });

    document.getElementById('playBtn').addEventListener('click', () => {
      if (isPlaying) {
        stopPlayback();
      } else {
        isPlaying = true;
        document.getElementById('playIcon').className = "fa-solid fa-pause";
        document.getElementById('playText').innerText = "Tạm Dừng";

        if (currentLessonIdx < startIdx || currentLessonIdx > endIdx) {
          currentLessonIdx = startIdx;
          renderLesson(currentLessonIdx);
        }
        currentRepeat = 0;
        playCurrentLesson();
      }
    });

    function stopPlayback() {
      isPlaying = false;
      if (audioPlayer) { audioPlayer.pause(); audioPlayer.currentTime = 0; }
      if (synth) synth.cancel();
      currentUtterance = null;
      document.getElementById('playIcon').className = "fa-solid fa-play";
      document.getElementById('playText').innerText = "Phát Audio";
      document.querySelectorAll('.sentence-row').forEach(el => el.classList.remove('active-sentence'));
    }

    function handleLessonFinished() {
      if (!isPlaying) return;

      currentRepeat++;

      if (currentRepeat < currentRepeatLimit) {
        setTimeout(() => { if (isPlaying) playCurrentLesson(); }, 400);
      } else {
        currentRepeat = 0;

        if (currentLessonIdx < endIdx) {
          currentLessonIdx++;
          syncDropdownsToCurrent(currentLessonIdx);
          renderLesson(currentLessonIdx);
          setTimeout(() => { if (isPlaying) playCurrentLesson(); }, 600);
        } else {
          if (currentRepeatLimit === 999) {
            currentLessonIdx = startIdx;
            syncDropdownsToCurrent(currentLessonIdx);
            renderLesson(currentLessonIdx);
            setTimeout(() => { if (isPlaying) playCurrentLesson(); }, 800);
          } else {
            stopPlayback();
          }
        }
      }
    }

    function playCurrentLesson() {
      if (!isPlaying) return;
      if (currentMode === 'mp3') {
        playMp3();
      } else {
        playAi(0);
      }
    }

    function playMp3() {
      // HỖ TRỢ LINH HOẠT THƯ MỤC 'mp3' HOẶC 'audio' TRÊN HOSTING THỰC TẾ
      let mp3Src = `./mp3/lesson_${LESSONS_DATA[currentLessonIdx].id}.mp3`;
      if (audioPlayer.src && audioPlayer.src.includes('audio')) {
          mp3Src = `./audio/lesson_${LESSONS_DATA[currentLessonIdx].id}.mp3`;
      }
      
      audioPlayer.src = mp3Src;
      audioPlayer.playbackRate = currentSpeed;
      
      audioPlayer.play().catch(() => {
        // Fallback sang thư mục 'audio' nếu thư mục 'mp3' thất bại
        if (mp3Src.includes('/mp3/')) {
             audioPlayer.src = `./audio/lesson_${LESSONS_DATA[currentLessonIdx].id}.mp3`;
             audioPlayer.play().catch(() => {
                 voiceBtn.click(); // Rớt hết thì chuyển sang AI
                 playCurrentLesson();
             });
        } else {
            voiceBtn.click();
            playCurrentLesson();
        }
      });

      audioPlayer.onended = () => {
        handleLessonFinished();
      };
    }

    function playAi(sIdx) {
      if (!synth || !isPlaying) return;
      const item = LESSONS_DATA[currentLessonIdx];

      // KHÓA ĐỌC 3 CÂU
      if (!item.sentences || sIdx >= item.sentences.length || sIdx >= 3) {
        handleLessonFinished();
        return;
      }

      document.querySelectorAll('.sentence-row').forEach(el => el.classList.remove('active-sentence'));
      const row = document.getElementById(`sent-${sIdx}`);
      if (row) row.classList.add('active-sentence');

      synth.cancel();
      if (synth.paused) synth.resume();

      currentUtterance = new SpeechSynthesisUtterance(item.sentences[sIdx].en);
      currentUtterance.lang = 'en-US';
      currentUtterance.rate = currentSpeed;
      
      const v = getEnVoice();
      if (v) currentUtterance.voice = v;

      currentUtterance.onend = () => {
        if (isPlaying) setTimeout(() => playAi(sIdx + 1), 350);
      };
      currentUtterance.onerror = () => {
        if (isPlaying) setTimeout(() => playAi(sIdx + 1), 350);
      };

      synth.speak(currentUtterance);
    }

    window.playSingleSentence = function(text, sIdx) {
      stopPlayback();
      if (!synth) return;
      document.querySelectorAll('.sentence-row').forEach(el => el.classList.remove('active-sentence'));
      const row = document.getElementById(`sent-${sIdx}`);
      if (row) row.classList.add('active-sentence');
      
      synth.cancel();
      if (synth.paused) synth.resume();

      currentUtterance = new SpeechSynthesisUtterance(text);
      currentUtterance.lang = 'en-US';
      currentUtterance.rate = currentSpeed;
      
      const v = getEnVoice();
      if (v) currentUtterance.voice = v;

      currentUtterance.onend = () => row.classList.remove('active-sentence');
      currentUtterance.onerror = () => row.classList.remove('active-sentence');

      synth.speak(currentUtterance);
    };

    document.getElementById('prevBtn').addEventListener('click', () => {
      if (currentLessonIdx > 0) {
        stopPlayback();
        currentLessonIdx--;
        syncDropdownsToCurrent(currentLessonIdx);
        renderLesson(currentLessonIdx);
        currentRepeat = 0;
        
        isPlaying = true;
        document.getElementById('playIcon').className = "fa-solid fa-pause";
        document.getElementById('playText').innerText = "Tạm Dừng";
        playCurrentLesson();
      }
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (currentLessonIdx < LESSONS_DATA.length - 1) {
        stopPlayback();
        currentLessonIdx++;
        syncDropdownsToCurrent(currentLessonIdx);
        renderLesson(currentLessonIdx);
        currentRepeat = 0;
        
        isPlaying = true;
        document.getElementById('playIcon').className = "fa-solid fa-pause";
        document.getElementById('playText').innerText = "Tạm Dừng";
        playCurrentLesson();
      }
    });

    setTimeout(() => {
        initLessonSelectors();
        renderLesson(startIdx);
        updateRepeatDisplay();
    }, 100);

  </script>
</body>
</html>
