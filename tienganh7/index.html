<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Học Từ Vựng Tiếng Anh Lớp 7 - Global Success</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Quicksand', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            touch-action: manipulation;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header Trang Chủ -->
    <header class="bg-gradient-to-r from-indigo-700 via-indigo-600 to-purple-600 text-white shadow-md sticky top-0 z-40 px-4 py-3.5">
        <div class="max-w-2xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center text-xl shadow-inner">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div>
                    <h1 class="text-sm sm:text-base font-black tracking-wide leading-tight">
                        TỪ VỰNG TIẾNG ANH LỚP 7
                    </h1>
                    <p class="text-[11px] text-indigo-200 font-semibold">Global Success • 12 Chủ Đề Bài Học</p>
                </div>
            </div>

            <!-- Nút Quản Lý Google Sheet (Mật khẩu: 1) -->
            <button onclick="openSheetWithPassword()" class="bg-white/15 hover:bg-white/25 active:scale-95 text-white px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 border border-white/20 shadow-sm" title="Nạp từ vựng Google Sheet">
                <i class="fa-solid fa-file-excel text-emerald-300"></i>
                <span class="hidden sm:inline">Nạp Từ</span>
            </button>
        </div>
    </header>

    <!-- Khối Nội Dung Chính -->
    <main class="max-w-2xl mx-auto px-3 sm:px-4 py-5 w-full flex-1 space-y-5">

        <!-- Banner Giới Thiệu Ngắn Gọn -->
        <div class="bg-white border border-slate-200/90 rounded-2xl p-4 shadow-sm flex items-center justify-between gap-3">
            <div class="space-y-0.5">
                <h2 class="text-xs sm:text-sm font-black text-indigo-950 uppercase tracking-wide">
                    Phương pháp học tập thông minh
                </h2>
                <p class="text-[11px] text-slate-500 font-medium">
                    Mỗi Unit tích hợp: <span class="text-indigo-600 font-bold">Truyền thống</span> • <span class="text-emerald-600 font-bold">Flashcard</span> • <span class="text-amber-600 font-bold">Siêu Trí Nhớ 3D</span>
                </p>
            </div>
            <div class="w-10 h-10 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center shrink-0 text-lg">
                <i class="fa-solid fa-bolt-lightning"></i>
            </div>
        </div>

        <!-- DANH SÁCH 12 UNIT DẠNG HÀNG DỌC KHOA HỌC -->
        <div class="space-y-3">
            <div class="flex items-center justify-between px-1">
                <span class="text-xs font-black text-slate-500 uppercase tracking-wider flex items-center gap-1.5">
                    <i class="fa-solid fa-list-ul text-indigo-600"></i> Chọn Bài Học (Unit 1 - 12)
                </span>
                <span class="text-[11px] font-bold text-indigo-600 bg-indigo-50 px-2.5 py-0.5 rounded-full border border-indigo-100">
                    Sách Global Success
                </span>
            </div>

            <!-- Khung chứa danh sách các nút bài học -->
            <div class="flex flex-col gap-2.5" id="unitListContainer">
                <!-- Tự động render bằng JavaScript -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-3.5 text-center text-xs text-slate-500">
        <p class="font-semibold">Ứng Dụng Học Từ Vựng Lớp 7 • Tích Hợp Kỹ Thuật Siêu Trí Nhớ</p>
    </footer>

    <!-- JavaScript Xử Lý -->
    <script>
        const SPREADSHEET_ID = '1CJRoOqup0piegWnWEfhoAhbYTWN4tPwv7AY6wJsIlK8';
        const EDIT_SHEET_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/edit`;

        // Danh sách 12 Unit chuẩn sách Tiếng Anh Lớp 7 Global Success
        const UNITS_LIST = [
            { id: 1, title: "Unit 1: Hobbies", viTitle: "Sở thích", icon: "🎨", color: "bg-amber-500" },
            { id: 2, title: "Unit 2: Healthy Living", viTitle: "Lối sống lành mạnh", icon: "🥗", color: "bg-emerald-500" },
            { id: 3, title: "Unit 3: Community Service", viTitle: "Dịch vụ cộng đồng", icon: "🤝", color: "bg-sky-500" },
            { id: 4, title: "Unit 4: Music and Arts", viTitle: "Âm nhạc & Nghệ thuật", icon: "🎵", color: "bg-purple-500" },
            { id: 5, title: "Unit 5: Food and Drink", viTitle: "Ẩm thực & Đồ uống", icon: "🍜", color: "bg-red-500" },
            { id: 6, title: "Unit 6: A Visit to a School", viTitle: "Thăm trường học", icon: "🏫", color: "bg-indigo-500" },
            { id: 7, title: "Unit 7: Traffic", viTitle: "Giao thông", icon: "🚦", color: "bg-yellow-500" },
            { id: 8, title: "Unit 8: Films", viTitle: "Phim ảnh", icon: "🎬", color: "bg-rose-500" },
            { id: 9, title: "Unit 9: Festivals around the World", viTitle: "Lễ hội khắp thế giới", icon: "🏮", color: "bg-pink-500" },
            { id: 10, title: "Unit 10: Energy Sources", viTitle: "Nguồn năng lượng", icon: "⚡", color: "bg-cyan-500" },
            { id: 11, title: "Unit 11: Travelling in the Future", viTitle: "Du lịch tương lai", icon: "🚀", color: "bg-blue-600" },
            { id: 12, title: "Unit 12: English-speaking Countries", viTitle: "Các nước nói tiếng Anh", icon: "🌍", color: "bg-teal-500" }
        ];

        // Render danh sách các nút bài học theo chiều dọc
        function renderUnitList() {
            const container = document.getElementById('unitListContainer');
            if (!container) return;
            container.innerHTML = '';

            UNITS_LIST.forEach(unit => {
                const row = document.createElement('a');
                row.href = `unit${unit.id}/index.html`;
                row.className = "group bg-white border border-slate-200/90 hover:border-indigo-500 hover:shadow-md rounded-2xl p-3.5 sm:p-4 transition-all duration-200 flex items-center justify-between gap-3 active:scale-[0.99]";

                row.innerHTML = `
                    <div class="flex items-center gap-3.5 min-w-0">
                        <span class="w-11 h-11 rounded-xl ${unit.color} text-white flex items-center justify-center text-xl shadow-sm shrink-0 group-hover:scale-105 transition-transform">
                            ${unit.icon}
                        </span>
                        <div class="min-w-0">
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] font-black text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md">Unit ${unit.id}</span>
                            </div>
                            <h3 class="font-extrabold text-sm sm:text-base text-slate-800 group-hover:text-indigo-600 transition-colors truncate mt-0.5">
                                ${unit.title}
                            </h3>
                            <p class="text-xs font-semibold text-slate-400 truncate">
                                ${unit.viTitle}
                            </p>
                        </div>
                    </div>

                    <div class="flex items-center gap-3 shrink-0">
                        <div class="hidden sm:flex items-center gap-1.5 text-[10px] font-bold text-slate-400">
                            <span class="bg-slate-100 px-2 py-1 rounded-lg">Truyền thống</span>
                            <span class="bg-slate-100 px-2 py-1 rounded-lg">Flashcard</span>
                            <span class="bg-slate-100 px-2 py-1 rounded-lg">Tranh 3D</span>
                        </div>
                        <span class="w-9 h-9 rounded-xl bg-slate-50 group-hover:bg-indigo-600 group-hover:text-white text-slate-400 flex items-center justify-center transition-colors shadow-sm">
                            <i class="fa-solid fa-chevron-right text-xs"></i>
                        </span>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        // Mở Google Sheet với mật khẩu '1'
        function openSheetWithPassword() {
            let pass = prompt("Vui lòng nhập mật khẩu (nhập số 1) để truy cập Google Sheet:");
            if (pass === "1") {
                window.open(EDIT_SHEET_URL, '_blank');
            } else if (pass !== null) {
                alert("Mật khẩu không đúng! Vui lòng nhập số 1.");
            }
        }

        window.onload = () => {
            renderUnitList();
        };
    </script>
</body>
</html>
